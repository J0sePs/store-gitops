# Application raíz (app-of-apps). Se aplica a mano UNA sola vez:
#   kubectl apply -f argocd/root-app.yaml
# Sincroniza la carpeta argocd/apps, donde hay una Application por componente.
# A partir de ahí todo se gestiona desde git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: store-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: store
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/J0sePs/store-gitops.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
