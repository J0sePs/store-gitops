# Base de datos PostgreSQL de products-service. Es propia de este servicio (database-per-service):
# ningún otro componente se conecta a ella.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: products-db
  labels:
    app.kubernetes.io/name: products-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: store
spec:
  serviceName: products-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: products-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: products-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: store
    spec:
      # Usuario "postgres" de la imagen alpine (uid 70); fsGroup deja el volumen escribible
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Memoria reducida para caber en nodos t3.small: "args" reemplaza el CMD de la imagen, por eso se repite "postgres"
          args:
            - postgres
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=20
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: products
            - name: POSTGRES_DB
              value: products
            # El volumen EBS trae lost+found: los datos van en un subdirectorio
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # La contraseña no está en git: el Secret se crea a mano (ver README)
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: products-db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "products", "-d", "products"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "products", "-d", "products"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # Un PVC gp3 propio por base de datos
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
