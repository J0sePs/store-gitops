# Deployment de frontend. La imagen se referencia por su nombre lógico "frontend": el bloque "images"
# del kustomization.yaml lo resuelve al repositorio de ECR y al tag (SHA corto) que pone la CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: store
spec:
  replicas: 2
  # El pod nuevo debe estar listo antes de retirar el anterior (sin cortes)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: frontend
          ports:
            - name: http
              containerPort: 8080
          env:
            # Kustomize copia aquí el tag de la imagen (ver "replacements"); este valor es solo un marcador
            - name: APP_VERSION
              value: set-by-kustomize
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
