apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store
resources:
  - deployment.yaml
  - service.yaml
# La CI actualiza este bloque con: kustomize edit set image products-service=<repositorio ECR>:<sha corto>
# Hasta que corra la CI, la imagen es un marcador (cuenta 000000000000, tag 0000000).
images:
  - name: products-service
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/products-service
    newTag: "0000000"
# APP_VERSION toma siempre el tag de la imagen ya transformada (no hay que editarlo a mano)
replacements:
  - source:
      kind: Deployment
      name: products-service
      fieldPath: "spec.template.spec.containers.[name=products-service].image"
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: products-service
        fieldPaths:
          - "spec.template.spec.containers.[name=products-service].env.[name=APP_VERSION].value"
