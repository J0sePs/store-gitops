# Deployment de products-service. La imagen se referencia por su nombre lógico "products-service": el bloque "images"
# del kustomization.yaml lo resuelve al repositorio de ECR y al tag (SHA corto) que pone la CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  labels:
    app.kubernetes.io/name: products-service
    app.kubernetes.io/part-of: store
spec:
  replicas: 1
  # El pod nuevo debe estar listo antes de retirar el anterior (sin cortes)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: products-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: products-service
        app.kubernetes.io/part-of: store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: products-service
          image: products-service
          ports:
            - name: http
              containerPort: 8000
          env:
            # Kustomize copia aquí el tag de la imagen (ver "replacements"); este valor es solo un marcador
            - name: APP_VERSION
              value: set-by-kustomize
            # La URL de conexión (con la contraseña) vive en un Secret que se crea a mano (ver README)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: products-db-credentials
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
